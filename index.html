<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sporto — sports Wear</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold:        #9a9a9a;
    --gold-light:  #c4c4c4;
    --gold-dim:    rgba(255,255,255,0.08);
    --gold-border: rgba(255,255,255,0.15);
    --black:       #0f0f0f;
    --off-black:   #1a1a1a;
    --gray:        #a8a8a8;
    --light-gray:  #2a2a2a;
    --white:       #ffffff;
    --grad:        linear-gradient(135deg, #4a4a4a 0%, #1a1a1a 100%);

    /* liquid glass tokens */
    --glass-bg:        rgba(255,255,255,0.06);
    --glass-bg-strong: rgba(255,255,255,0.12);
    --glass-border:    rgba(255,255,255,0.14);
    --glass-shadow:    0 20px 60px rgba(0,0,0,0.55);
    --glass-blur:      24px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    font-weight: 300;
    letter-spacing: 0.01em;
    color: var(--white);
    background: #0a0a0c;
  }

  /* floating glass orbs for ambient liquid feel */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 460px;
    height: 460px;
    top: -140px;
    left: -140px;
    background: radial-gradient(circle, rgba(56,142,255,0.55) 0%, transparent 70%);
    animation: float1 14s ease-in-out infinite;
  }
  body::after {
    width: 420px;
    height: 420px;
    bottom: -160px;
    right: -120px;
    background: radial-gradient(circle, rgba(255,140,56,0.5) 0%, transparent 70%);
    animation: float2 16s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(40px, 30px) scale(1.08); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(-30px, -25px) scale(1.06); }
  }

  /* ── CONTAINER — the liquid glass card ── */
  .container {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    border-radius: 28px;
    padding: 48px 36px;
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--glass-border);
    box-shadow:
      var(--glass-shadow),
      inset 0 1px 1px rgba(255,255,255,0.15),
      inset 0 -1px 1px rgba(255,255,255,0.04);
    position: relative;
    text-align: center;
    z-index: 1;
    overflow: hidden;
  }

  /* glossy top sheen — the "liquid" highlight */
  .container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent);
    pointer-events: none;
    border-radius: 28px 28px 50% 50% / 28px 28px 30% 30%;
  }

  /* ── LANG TOGGLE ── */
  .lang-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gray);
    cursor: pointer;
    transition: all 0.25s ease;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .lang-toggle:hover {
    border-color: rgba(255,255,255,0.4);
    color: var(--white);
    background: rgba(255,255,255,0.14);
  }
  .lang-toggle span { font-size: 13px; }

  /* ── BRAND ── */
  .brand-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: 4px;
    line-height: 1;
    position: relative;
    z-index: 2;
  }

  .brand-tagline {
    font-size: 9px;
    letter-spacing: 5px;
    color: var(--gray);
    text-transform: uppercase;
    margin-bottom: 40px;
    font-weight: 400;
    position: relative;
    z-index: 2;
  }

  /* ── LINKS WRAPPER ── */
  .links-wrapper {
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    z-index: 2;
  }

  /* ── BUTTONS — glass pills ── */
  .link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 24px;
    border-radius: 16px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid var(--glass-border);
    width: 100%;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .link-btn:hover { transform: translateY(-3px); }
  .link-btn:active { transform: scale(0.98); }

  /* Primary — solid white like reference */
  .btn-primary {
    background: rgba(255,255,255,0.92);
    color: var(--black);
    box-shadow: 0 6px 18px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.9);
  }
  .btn-primary:hover {
    background: rgba(255,255,255,1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.8);
  }

  /* Outline — dark glass */
  .btn-outline {
    background: rgba(255,255,255,0.07);
    color: var(--white);
    box-shadow: 0 4px 14px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.08);
  }
  .btn-outline:hover {
    border-color: rgba(255,255,255,0.3);
    color: var(--white);
    background: rgba(255,255,255,0.13);
  }

  .btn-label { flex: 1; text-align: center; }

  /* ── DIVIDER ── */
  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
    margin: 6px 0;
  }

  /* ── FOOTER TEXT ── */
  .footer-text {
    margin-top: 32px;
    font-size: 10px;
    color: var(--gray);
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }

  /* ── RIPPLE ── */
  @keyframes ripple {
    0%   { transform: scale(0); opacity: 0.5; }
    100% { transform: scale(4); opacity: 0; }
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    animation: ripple 0.6s linear;
    pointer-events: none;
    width: 20px;
    height: 20px;
    margin-top: -10px;
    margin-left: -10px;
  }

  /* ── LANGUAGE SWITCH ── */
  [lang-ar] .en-text { display: none; }
  [lang-ar] .ar-text { display: inline; }
  .ar-text { display: none; }

  /* reduced motion respect */
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after { animation: none; }
    .link-btn, .lang-toggle { transition: none; }
  }

  @media (max-width: 480px) {
    .brand-logo { font-size: 48px; letter-spacing: 7px; }
    .container { padding: 40px 24px; }
  }
</style>
  <link rel="stylesheet" href="redesign.css">
</head>
<body>
<div class="container" id="mainCard">

  

  <div class="brand-logo">sporto</div>
  <div class="brand-tagline">
    <span class="en-text">sports wear</span>
    <span class="ar-text">ملابس رياضيه ب اعلي جوده</span>
  </div>

  <div class="links-wrapper">

    <a href="shop.html" class="link-btn btn-primary" onclick="addRipple(event)">
      <div class="btn-label">
        <span class="en-text">Our Website</span>
        <span class="ar-text"> موقعنا</span>
      </div>
    </a>

    <a href="https://www.instagram.com/webgy_?igsh=ZHFqcWhmeWtzOWMy&utm_source=qr" target="_blank" class="link-btn btn-outline" onclick="addRipple(event)">
      <div class="btn-label">
        <span class="en-text">Our Instagram</span>
        <span class="ar-text">إنستجرام AvoRa</span>
      </div>
    </a>

    <a href="https://www.tiktok.com/@webgy_?_r=1&_t=ZS-97Hf3dqQz5D" target="_blank" class="link-btn btn-outline" onclick="addRipple(event)">
      <div class="btn-label">
        <span class="en-text">Our TikTok</span>
        <span class="ar-text">تيك توك AvoRa</span>
      </div>
    </a>

    <div class="divider"></div>

    

  </div>

  <div class="footer-text">© 2026 SPORTO · <span class="footer-credit">
  <svg class="credit-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>
  <span class="credit-label">POWERED BY</span>
  <a href="https://www.instagram.com/webgy_?igsh=ZHFqcWhmeWtzOWMy&utm_source=qr" target="_blank" rel="noopener" class="credit-link">webgy</a>

  <a href="https://www.instagram.com/engy_mostaffa/" target="_blank" rel="noopener" class="credit-link">Engy Mostafa</a>
</span></div>
</div>

<script>
let isArabic = false;



function addRipple(e) {
  const btn = e.currentTarget;
  const ripple = document.createElement('span');
  ripple.classList.add('ripple');
  const rect = btn.getBoundingClientRect();
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);
}
</script>
</body>
</html>
