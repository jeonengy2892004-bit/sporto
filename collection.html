<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTO — Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --gold:        #b8b8b8;
  --gold-light:  #e0e0e0;
  --gold-dim:    rgba(255,255,255,0.08);
  --gold-border: rgba(255,255,255,0.16);
  --black:       #0a0a0c;
  --off-black:   #151517;
  --gray:        #a8a8a8;
  --light-gray:  #d6d6d6;
  --white:       #ffffff;
  --red:         #e0584a;
  --green:       #3fb872;
  --g1:          #e0e0e0;
  --g2:          #b8b8b8;

  --glass-bg:        rgba(255,255,255,0.06);
  --glass-bg-strong: rgba(255,255,255,0.12);
  --glass-border:    rgba(255,255,255,0.14);
  --glass-blur:      18px;
}

html { scroll-behavior:smooth; }
body {
  font-family:'Inter', sans-serif;
  background:var(--black);
  color:var(--white);
  overflow-x:hidden;
  font-weight:300;
  letter-spacing:0.01em;
  position:relative;
}

body::before, body::after {
  content:'';
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
  z-index:0;
}
body::before {
  width:520px; height:520px; top:-160px; left:-160px;
  background:radial-gradient(circle, rgba(56,142,255,0.28) 0%, transparent 70%);
  animation:float1 16s ease-in-out infinite;
}
body::after {
  width:480px; height:480px; bottom:-160px; right:-140px;
  background:radial-gradient(circle, rgba(255,140,56,0.24) 0%, transparent 70%);
  animation:float2 18s ease-in-out infinite;
}
@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,30px) scale(1.08);} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,-25px) scale(1.06);} }

/* ── HEADER ── */
header {
  position:sticky; top:0; z-index:200;
  background:rgba(10,10,12,0.55);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.header-inner {
  max-width:1200px; margin:0 auto; padding:0 32px; height:68px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.header-left { display:flex; align-items:center; gap:16px; }
.back-btn {
  display:flex; align-items:center; gap:6px;
  font-size:11px; color:var(--gray); text-decoration:none;
  font-weight:400; letter-spacing:1px; text-transform:uppercase;
  transition:color 0.2s;
}
.back-btn:hover { color:var(--white); }
.brand-name-header {
  font-family:'Cormorant Garamond', serif;
  font-size:28px; font-weight:700; letter-spacing:8px;
  text-transform:uppercase; color:var(--white);
  text-decoration:none; background:none;
  -webkit-text-fill-color:var(--white);
  position:absolute; left:50%; transform:translateX(-50%);
}
.header-right { display:flex; align-items:center; gap:14px; }
.cart-btn {
  position:relative; width:40px; height:40px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.16);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--white); transition:all 0.2s;
}
.cart-btn:hover { border-color:rgba(255,255,255,0.4); background:rgba(255,255,255,0.12); }
.cart-badge {
  position:absolute; top:-5px; right:-5px;
  background:var(--white); color:var(--black);
  font-size:9px; font-weight:600; width:17px; height:17px;
  border-radius:50%; display:none; align-items:center; justify-content:center;
}

/* ── BREADCRUMB ── */
.breadcrumb {
  max-width:1200px; margin:0 auto; padding:16px 32px 0;
  display:flex; align-items:center; gap:8px;
  font-size:11px; color:var(--gray); letter-spacing:1px;
  position:relative; z-index:1;
}
.breadcrumb a { color:var(--gray); text-decoration:none; transition:color 0.2s; }
.breadcrumb a:hover { color:var(--white); }
.breadcrumb span { color:#555; }

/* ── PAGE TITLE ── */
.page-title-wrap { max-width:1200px; margin:0 auto; padding:18px 32px 0; position:relative; z-index:1; }
.page-title {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(28px,4vw,44px); font-weight:700; letter-spacing:3px;
  text-transform:uppercase; color:var(--white);
}
.page-count { font-size:11px; color:var(--gray); letter-spacing:1px; margin-top:6px; }

/* ── LAYOUT ── */
.collection-layout {
  max-width:1200px; margin:0 auto; padding:28px 32px 80px;
  display:grid; grid-template-columns:240px 1fr; gap:36px;
  position:relative; z-index:1;
}
@media(max-width:900px){
  .collection-layout { grid-template-columns:1fr; }
}

/* ── FILTERS SIDEBAR ── */
.filters {
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:18px;
  padding:24px;
  height:fit-content;
  position:sticky; top:88px;
}
@media(max-width:900px){ .filters{ position:static; } }
.filter-group { margin-bottom:26px; }
.filter-group:last-child { margin-bottom:0; }
.filter-title {
  font-size:10px; font-weight:600; letter-spacing:3px; text-transform:uppercase;
  color:var(--gray); margin-bottom:14px;
}
.filter-option {
  display:flex; align-items:center; gap:10px;
  font-size:12px; color:var(--light-gray); margin-bottom:10px;
  cursor:pointer; user-select:none;
}
.filter-option input { accent-color:var(--white); width:14px; height:14px; cursor:pointer; }
.filter-option:hover { color:var(--white); }
.price-range { display:flex; flex-direction:column; gap:10px; }
.price-range input[type=range] { width:100%; accent-color:var(--white); }
.price-range-vals { display:flex; justify-content:space-between; font-size:11px; color:var(--gray); }
.clear-filters-btn {
  width:100%; padding:10px; margin-top:6px;
  background:rgba(255,255,255,0.06); border:1px solid var(--glass-border);
  color:var(--light-gray); border-radius:999px; font-size:10px; letter-spacing:2px;
  text-transform:uppercase; cursor:pointer; transition:all 0.2s;
}
.clear-filters-btn:hover { background:rgba(255,255,255,0.14); color:var(--white); }

/* mobile filter toggle */
.filter-toggle-btn {
  display:none; width:100%; padding:12px; margin-bottom:16px;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  color:var(--white); border-radius:999px; font-size:11px; letter-spacing:2px;
  text-transform:uppercase; cursor:pointer; align-items:center; justify-content:center; gap:8px;
}
@media(max-width:900px){
  .filter-toggle-btn { display:flex; }
  .filters { display:none; }
  .filters.open { display:block; }
}

/* ── SORT BAR ── */
.sort-bar {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; gap:12px; flex-wrap:wrap;
}
.sort-select {
  background:var(--glass-bg); border:1px solid var(--glass-border);
  color:var(--white); padding:9px 14px; border-radius:999px;
  font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  font-family:'Inter', sans-serif;
}
.sort-select option { background:#1a1a1c; color:var(--white); }

/* ── PRODUCTS GRID ── */
.products-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px; }
.product-card {
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  border-radius:18px; overflow:hidden;
  border:1px solid var(--glass-border);
  transition:transform 0.3s, box-shadow 0.3s, border-color 0.3s;
  cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,0.3);
}
.product-card:hover {
  transform:translateY(-4px);
  box-shadow:0 16px 40px rgba(0,0,0,0.45);
  border-color:rgba(255,255,255,0.3);
}
.product-img-wrapper { position:relative; aspect-ratio:1; overflow:hidden; background:rgba(255,255,255,0.04); }
.product-img-wrapper img { width:100%; height:100%; object-fit:cover; transition:transform 0.5s; }
.product-card:hover .product-img-wrapper img { transform:scale(1.06); }
.product-badge {
  position:absolute; top:10px; left:10px; background:rgba(255,255,255,0.9);
  color:var(--black); font-size:9px; font-weight:600; padding:4px 10px;
  border-radius:999px; letter-spacing:1px;
}
.stock-badge {
  position:absolute; bottom:8px; left:10px;
  background:rgba(0,0,0,0.55); backdrop-filter:blur(6px);
  color:white; font-size:9px; padding:3px 10px;
  border-radius:999px; font-weight:400; letter-spacing:0.5px;
  border:1px solid rgba(255,255,255,0.1);
}
.stock-badge.low { background:rgba(224,88,74,0.65); }
.stock-badge.out { background:rgba(120,120,120,0.6); }
.product-info { padding:14px 14px 12px; }
.product-name {
  font-size:12px; font-weight:400; color:var(--white); letter-spacing:0.5px;
  margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.product-bottom-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.product-price-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.price-old { font-size:11px; color:#8a8a8a; text-decoration:line-through; }
.price-new { font-size:14px; font-weight:500; color:var(--red); }
.price-regular { font-size:14px; font-weight:500; color:var(--white); }
.atc-btn {
  width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,0.92); border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--black); flex-shrink:0; transition:all 0.2s;
}
.atc-btn:hover { background:var(--white); transform:scale(1.06); }
.atc-btn:disabled { opacity:0.3; cursor:not-allowed; }
.atc-btn.added {
  background:var(--green); color:white; min-width:76px; width:auto; padding:0 10px;
  border-radius:999px; font-size:10px; font-weight:500; gap:4px; letter-spacing:0.5px;
}
.empty-state { text-align:center; padding:60px 20px; color:#888; grid-column:1/-1; }

/* ── CART SIDEBAR ── */
.cart-overlay { position:fixed; inset:0; background:rgba(0,0,0,0); z-index:250; pointer-events:none; transition:background 0.3s; }
.cart-overlay.open { background:rgba(0,0,0,0.5); pointer-events:all; }
.cart-sidebar {
  position:fixed; top:0; right:-100%; width:min(360px, 95vw); height:100%;
  background:rgba(15,15,17,0.85);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  z-index:260; box-shadow:-4px 0 32px rgba(0,0,0,0.5);
  transition:right 0.35s ease; display:flex; flex-direction:column; border-left:1px solid rgba(255,255,255,0.1);
}
.cart-sidebar.open { right:0; }
.cart-header { padding:20px 24px; border-bottom:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:space-between; }
.cart-title { font-size:12px; font-weight:500; letter-spacing:3px; text-transform:uppercase; color:var(--white); }
.cart-close { width:30px; height:30px; border:1px solid rgba(255,255,255,0.2); border-radius:50%; background:rgba(255,255,255,0.06); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--gray); font-size:12px; }
.cart-items { flex:1; overflow-y:auto; padding:16px; }
.cart-item { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
.cart-item-img { width:68px; height:68px; border-radius:10px; object-fit:cover; background:var(--glass-bg); flex-shrink:0; border:1px solid rgba(255,255,255,0.1); }
.cart-item-info { flex:1; }
.cart-item-name { font-size:12px; font-weight:400; margin-bottom:4px; letter-spacing:0.3px; color:var(--white); }
.cart-item-price { font-size:13px; color:var(--gray); font-weight:500; }
.cart-item-remove {
  width:26px; height:26px; border:1px solid rgba(255,255,255,0.16); border-radius:50%;
  background:rgba(255,255,255,0.05); color:var(--gray); cursor:pointer; font-size:11px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; align-self:flex-start; transition:all 0.2s;
}
.cart-item-remove:hover { border-color:var(--red); color:var(--red); }
.cart-empty { text-align:center; padding:56px 20px; color:var(--gray); }
.cart-footer { padding:20px 24px; border-top:1px solid rgba(255,255,255,0.1); }
.cart-total { display:flex; justify-content:space-between; font-size:13px; font-weight:500; margin-bottom:14px; letter-spacing:0.5px; color:var(--white); }
.checkout-btn {
  display:block; width:100%; padding:15px; background:rgba(255,255,255,0.92); color:var(--black);
  border:none; border-radius:999px; font-size:10px; font-weight:500; letter-spacing:3px;
  text-transform:uppercase; cursor:pointer; transition:all 0.2s; text-align:center; text-decoration:none;
}
.checkout-btn:hover { background:var(--white); }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(20,20,22,0.85);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  color:white; padding:12px 24px;
  border-radius:999px; font-size:12px; font-weight:400; letter-spacing:1px;
  z-index:999; transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space:nowrap; border:1px solid rgba(255,255,255,0.16);
}
.toast.show { transform:translateX(-50%) translateY(0); }


/* ── SPORTO IMAGE LOADING PLACEHOLDER ── */
@keyframes sportoImageShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.product-img-wrapper img,
.category-card img,
.cart-item-img,
.summary-item img,
.thumb,
#mainImg,
.table-img {
  background: linear-gradient(110deg, rgba(255,255,255,0.045) 8%, rgba(255,255,255,0.14) 18%, rgba(255,255,255,0.045) 33%);
  background-size: 200% 100%;
  animation: sportoImageShimmer 1.45s ease-in-out infinite;
}
img.image-loaded {
  animation: none;
  background: transparent;
}
img.image-failed {
  animation: none;
  background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.035));
}
@media (prefers-reduced-motion: reduce) {
  img:not(.image-loaded) { animation: none; }
}

</style>

</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <a href="shop.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
    </div>
    <a href="shop.html" class="brand-name-header">SPORTO</a>
    <div class="header-right">
      <button class="cart-btn" onclick="toggleCart()" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </div>
</header>

<div class="breadcrumb" id="breadcrumb">
  <a href="shop.html">Home</a>
  <span>›</span>
  <span id="bcGender">—</span>
</div>

<div class="page-title-wrap">
  <div class="page-title" id="pageTitle">Collection</div>
  <div class="page-count" id="pageCount">Loading products...</div>
</div>

<div class="collection-layout">

  <!-- FILTERS -->
  <div>
    <button class="filter-toggle-btn" onclick="toggleFilters()">⚙ Filters</button>
    <div class="filters" id="filtersPanel">
      <div class="filter-group">
        <div class="filter-title">Gender</div>
        <label class="filter-option"><input type="radio" name="gender" value="" checked onchange="applyFilters()"> All</label>
        <label class="filter-option"><input type="radio" name="gender" value="men" onchange="applyFilters()"> Men</label>
        <label class="filter-option"><input type="radio" name="gender" value="women" onchange="applyFilters()"> Women</label>
      </div>
      <div class="filter-group">
        <div class="filter-title">Max Price</div>
        <div class="price-range">
          <input type="range" id="priceRange" min="0" max="5000" step="50" value="5000" oninput="applyFilters()">
          <div class="price-range-vals"><span>0 EGP</span><span id="priceVal">5000 EGP</span></div>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-title">Availability</div>
        <label class="filter-option"><input type="checkbox" id="inStockOnly" onchange="applyFilters()"> In stock only</label>
      </div>
      <button class="clear-filters-btn" onclick="clearFilters()">Clear All Filters</button>
    </div>
  </div>

  <!-- PRODUCTS -->
  <div>
    <div class="sort-bar">
      <span style="font-size:11px;color:var(--gray);" id="resultsCount"></span>
      <select class="sort-select" id="sortSelect" onchange="applyFilters()">
        <option value="default">Sort: Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="name-asc">Name: A-Z</option>
      </select>
    </div>
    <div class="products-grid" id="productsGrid">
      <div class="empty-state">⟳ Loading products...</div>
    </div>
  </div>

</div>

<!-- CART SIDEBAR -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <div class="cart-title">👟 Your Cart</div>
    <button class="cart-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">
      <div style="font-size:48px;margin-bottom:12px;">👟</div>
      <div>Your cart is empty</div>
    </div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal" style="color:var(--g1);">0 EGP</span>
    </div>
    <a href="checkout.html" class="checkout-btn">Proceed to Checkout →</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
let PRODUCTS = [];
let filteredProducts = [];
const GENDER_NAMES = { men:'Men', women:'Women' };

let cart = JSON.parse(localStorage.getItem('sporto_cart') || '[]');

document.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  const gender = params.get('gender') || '';
  const saleOnly = params.get('sale') === '1';
  if (gender) document.querySelector(`input[name="gender"][value="${gender}"]`).checked = true;

  window.sportoSaleOnly = saleOnly;
  updateBreadcrumb(gender, saleOnly);
  updateCartUI();
  await loadFromFirebase();
  applyFilters();
});

function updateBreadcrumb(gender, saleOnly = window.sportoSaleOnly) {
  document.getElementById('bcGender').textContent = saleOnly ? 'Sale' : (gender ? GENDER_NAMES[gender] : 'All');
  document.getElementById('pageTitle').textContent = saleOnly ? 'Sale' : (gender ? GENDER_NAMES[gender] : 'All Products');
}

async function loadFromFirebase() {
  try {
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js');
    const { getFirestore, collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js');
    const cfg = window.SPORTO_FIREBASE_CONFIG || window.ARQA_FIREBASE_CONFIG;
    if (!cfg || cfg.apiKey === "YOUR_API_KEY") return;
    const app = getApps().length ? getApps()[0] : initializeApp(cfg);
    const db = getFirestore(app);
    const snap = await getDocs(collection(db, 'products'));
    if (!snap.empty) PRODUCTS = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  } catch(e) { console.log('Firebase:', e.message); }
}

function applyFilters() {
  const gender = document.querySelector('input[name="gender"]:checked').value;
  const maxPrice = parseInt(document.getElementById('priceRange').value);
  const inStockOnly = document.getElementById('inStockOnly').checked;
  const sort = document.getElementById('sortSelect').value;

  document.getElementById('priceVal').textContent = `${maxPrice} EGP`;
  updateBreadcrumb(gender, window.sportoSaleOnly);

  filteredProducts = PRODUCTS.filter(p => {
    if (gender && p.gender !== gender && p.gender !== 'unisex') return false;
    if (window.sportoSaleOnly && !(p.oldPrice && p.oldPrice > p.price)) return false;
    if (p.price > maxPrice) return false;
    if (inStockOnly && p.stock <= 0) return false;
    return true;
  });

  if (sort === 'price-asc') filteredProducts.sort((a,b) => a.price - b.price);
  else if (sort === 'price-desc') filteredProducts.sort((a,b) => b.price - a.price);
  else if (sort === 'name-asc') filteredProducts.sort((a,b) => a.name.localeCompare(b.name));

  renderProducts(filteredProducts);
  document.getElementById('resultsCount').textContent = `${filteredProducts.length} item${filteredProducts.length !== 1 ? 's' : ''}`;
  document.getElementById('pageCount').textContent = `${filteredProducts.length} item${filteredProducts.length !== 1 ? 's' : ''} found`;
}

function clearFilters() {
  document.querySelector('input[name="gender"][value=""]').checked = true;
  document.getElementById('priceRange').value = 5000;
  document.getElementById('inStockOnly').checked = false;
  document.getElementById('sortSelect').value = 'default';
  applyFilters();
}

function toggleFilters() {
  document.getElementById('filtersPanel').classList.toggle('open');
}

function renderProducts(products) {
  const grid = document.getElementById('productsGrid');
  if (!products.length) {
    grid.innerHTML = '<div class="empty-state">No products match your filters.</div>';
    return;
  }
  grid.innerHTML = products.map(p => {
    const hasOffer   = p.oldPrice && p.oldPrice > p.price;
    const discount   = hasOffer ? Math.round((1 - p.price/p.oldPrice)*100) : 0;
    const outOfStock = p.stock <= 0;
    const lowStock   = !outOfStock && p.stock <= 3;
    return `
    <div class="product-card" onclick="goToProduct('${p.id}')">
      <div class="product-img-wrapper">
        <img src="${p.images[0]}" alt="${p.name}" loading="lazy" onload="this.classList.add('image-loaded')"
             onerror="this.onerror=null; this.removeAttribute('src'); this.classList.add('image-failed')">
        ${hasOffer ? `<div class="product-badge">-${discount}%</div>` : ''}
        <div class="stock-badge ${outOfStock ? 'out' : lowStock ? 'low' : ''}">
          ${outOfStock ? 'Out of stock' : lowStock ? `${p.stock} left` : `${p.stock} in stock`}
        </div>
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-bottom-row">
          <div class="product-price-row">
            ${hasOffer
              ? `<span class="price-old">${p.oldPrice} EGP</span><span class="price-new">${p.price} EGP</span>`
              : `<span class="price-regular">${p.price} EGP</span>`}
          </div>
          <button class="atc-btn" id="atc_${p.id}"
            onclick="event.stopPropagation();quickAddToCart('${p.id}')"
            ${outOfStock ? 'disabled' : ''}
            title="Add to cart">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function goToProduct(id) { window.location.href = `product.html?id=${id}`; }

function quickAddToCart(id) {
  const p = PRODUCTS.find(p => p.id === id);
  if (!p || p.stock <= 0) return;
  const existing = cart.find(i => i.id === p.id);
  if (existing) existing.qty = Math.min(existing.qty + 1, p.stock);
  else cart.push({ id:p.id, name:p.name, price:p.price, img:p.images[0], qty:1, stock:p.stock });
  saveCart();
  updateCartUI();
  showToast(`✓ ${p.name} added to cart`);
  const btn = document.getElementById(`atc_${id}`);
  btn.classList.add('added');
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Added`;
  setTimeout(() => {
    btn.classList.remove('added');
    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>`;
  }, 2500);
}

function saveCart() { localStorage.setItem('sporto_cart', JSON.stringify(cart)); }

function updateCartUI() {
  const total = cart.reduce((s,i) => s+i.qty, 0);
  const badge = document.getElementById('cartBadge');
  badge.style.display = total > 0 ? 'flex' : 'none';
  badge.textContent = total;
}

function renderCartItems() {
  const container = document.getElementById('cartItems');
  const footer    = document.getElementById('cartFooter');
  if (!cart.length) {
    container.innerHTML = `<div class="cart-empty"><div style="font-size:48px;margin-bottom:12px;">👟</div><div>Your cart is empty</div></div>`;
    footer.style.display = 'none'; return;
  }
  container.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img class="cart-item-img" src="${item.img}" alt="${item.name}" onload="this.classList.add('image-loaded')"
           onerror="this.onerror=null; this.removeAttribute('src'); this.classList.add('image-failed')">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${item.price} EGP × ${item.qty}</div>
        <div style="font-size:13px;color:var(--g1);font-weight:600;">${item.price*item.qty} EGP</div>
      </div>
      <button class="cart-item-remove" onclick="removeFromCart('${item.id}')">✕</button>
    </div>`).join('');
  const subtotal = cart.reduce((s,i) => s+i.price*i.qty, 0);
  const shipping  = subtotal >= 900 ? 0 : 80;
  document.getElementById('cartTotal').textContent = `${subtotal+shipping} EGP`;
  footer.style.display = 'block';
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart(); updateCartUI(); renderCartItems();
}

function toggleCart() {
  const sidebar = document.getElementById('cartSidebar');
  const overlay = document.getElementById('cartOverlay');
  const isOpen  = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = '';
  } else {
    renderCartItems();
    sidebar.classList.add('open'); overlay.classList.add('open'); document.body.style.overflow = 'hidden';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
